<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#C92B2F">
<title>我的日程</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f3f2;color:#2b2323;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{background:linear-gradient(135deg,#C92B2F,#8E1B20);color:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:0 8px 24px rgba(201,43,47,.25);margin-bottom:16px}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12.5px;opacity:.92;margin-top:6px}
  .sec{margin-bottom:18px}
  .sec h2{font-size:15px;font-weight:700;color:#8E1B20;margin:0 6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sec h2 .cnt{font-weight:400;color:#a08b8c;font-size:12px}
  .card{background:#fff;border-radius:14px;padding:6px 0;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1px solid #f0e6e6;overflow:hidden}
  .it{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid #f7efef}
  .it:last-child{border-bottom:0}
  .it .t{flex:0 0 auto;min-width:96px;font-weight:700;color:#C92B2F;font-size:13.5px;padding-top:2px}
  .it .n{flex:1;font-weight:600;font-size:14.5px}
  .it .p{color:#9a8385;font-size:12px;margin-top:2px;font-weight:400}
  .empty{padding:16px 14px;color:#9a8385;font-size:13px;line-height:1.7}
  .plan-head{padding:10px 14px 0;color:#8E1B20;font-weight:700;font-size:14px}
  .enc{margin:8px 14px 4px;background:#FBE9EA;border:1px solid #f0c9cb;color:#8E1B20;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.6}
  .tl{padding:6px 14px 10px}
  .bl{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #f3e9e9}
  .bl:last-child{border-bottom:0}
  .bl .bt{flex:0 0 auto;min-width:96px;font-weight:700;color:#C92B2F;font-size:13px;padding-top:1px}
  .bl .bn{flex:1;font-size:14px;font-weight:600}
  .bl .bd{color:#9a8385;font-size:12px;font-weight:400;margin-top:1px}
  .bl.rest .bt{color:#a8935f}
  .bl.rest .bn{font-weight:500;color:#7d7458}
  .now{display:inline-block;background:#C92B2F;color:#fff;font-size:10.5px;border-radius:7px;padding:1px 7px;margin-left:6px;vertical-align:1px;font-weight:600}
  .tag{display:inline-block;font-size:11px;border-radius:7px;padding:1px 8px;margin-left:6px;background:#FBE9EA;color:#8E1B20;vertical-align:1px;white-space:nowrap}
  .dd{color:#b0562b;background:#fbeee4}
  footer{text-align:center;color:#b3a1a2;font-size:11.5px;margin-top:22px;line-height:1.8}
  .load{padding:40px 0;text-align:center;color:#a08b8c;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 我的日程</h1>
    <div class="sub" id="sub">正在加载…</div>
  </header>
  <div id="app"><div class="load">加载中…</div></div>
  <footer id="foot">由电脑上的「迟到消消乐」同步 · 数据只存在你自己的 GitHub 仓库里</footer>
</div>
<script>
(function(){
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmtUpd(ts){
    try{ var d=new Date(ts); function p(x){ return (x<10?'0':'')+x; }
      return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
    }catch(e){ return ''; }
  }
  function isNow(dateStr,s,e){
    try{
      var now=new Date();
      var today=now.getFullYear()+'-'+((now.getMonth()+1<10?'0':'')+(now.getMonth()+1))+'-'+((now.getDate()<10?'0':'')+now.getDate());
      if(dateStr&&dateStr!==today) return false;
      var hm=now.getHours()*60+now.getMinutes();
      function m(t){ var x=/(\d{1,2}):(\d{2})/.exec(t||''); return x?(+x[1])*60+(+x[2]):null; }
      var a=m(s),b=m(e); if(a==null||b==null) return false; if(b<a) b+=1440;
      return hm>=a&&hm<b;
    }catch(err){ return false; }
  }
  function itemHtml(it,dateStr){
    var now=isNow(dateStr,it.start,it.end);
    return '<div class="it"><div class="t">'+esc(it.time)
      +'</div><div class="n">'+esc(it.name)
      +(now?'<span class="now">进行中</span>':'')
      +(it.place?'<div class="p">📍 '+esc(it.place)+'</div>':'')
      +'</div></div>';
  }
  function blockHtml(b,dateStr){
    var rest=/休息|吃饭|午休|晚饭|午饭|运动|洗澡|睡觉/.test(b.name||'');
    var now=isNow(dateStr,b.start,b.end);
    return '<div class="bl'+(rest?' rest':'')+'"><div class="bt">'+esc(b.start)+'–'+esc(b.end)
      +'</div><div class="bn">'+esc(b.name)
      +(now?'<span class="now">进行中</span>':'')
      +(b.note?'<div class="bd">'+esc(b.note)+'</div>':'')
      +'</div></div>';
  }
  function render(d){
    var app=document.getElementById('app'); var h='';
    var today=d.today||{};
    h+='<div class="sec"><h2>📌 今天'+(today.label?' · '+esc(today.label):'')+'</h2><div class="card">';
    if(today.items&&today.items.length){ today.items.forEach(function(it){ h+=itemHtml(it,today.date); }); }
    else h+='<div class="empty">今天没有课程和行程安排 🎉</div>';
    h+='</div></div>';
    if(d.plan && d.plan.blocks && d.plan.blocks.length){
      var pw=d.plan.window||{};
      h+='<div class="sec"><h2>⏱️ 短时规划 <span class="cnt">'+esc(pw.start||'')+' → '+esc(pw.end||'')+'</span></h2><div class="card">';
      if(d.plan.encourage) h+='<div class="enc">💪 '+esc(d.plan.encourage)+'</div>';
      h+='<div class="tl">';
      d.plan.blocks.forEach(function(b){ h+=blockHtml(b,pw.date||today.date); });
      h+='</div></div></div>';
    }
    if(d.ideas && d.ideas.length){
      h+='<div class="sec"><h2>💡 想法箱 <span class="cnt">'+d.ideas.length+' 条待办</span></h2><div class="card">';
      d.ideas.forEach(function(x){
        h+='<div class="it"><div class="n" style="flex:1">'+esc(x.name)
          +(x.deadline?'<span class="tag dd">⏰ '+esc(x.deadlineLabel||x.deadline)+'</span>':(x.horizon?'<span class="tag">'+esc(x.horizon)+'</span>':''))
          +'</div></div>';
      });
      h+='</div></div>';
    }
    if(d.days && d.days.length){
      h+='<div class="sec"><h2>🗓️ 接下来几天</h2><div class="card">';
      d.days.forEach(function(day){
        var n=(day.items||[]).length;
        var line='';
        if(n){ line=day.items.slice(0,3).map(function(it){ return esc(it.name); }).join(' · ')+(n>3?' 等 '+n+' 项':''); }
        else line='<span style="color:#b3a1a2;font-weight:400">无安排</span>';
        h+='<div class="it"><div class="t" style="min-width:118px">'+esc(day.label)+'</div><div class="n">'+line+'</div></div>';
      });
      h+='</div></div>';
    }
    app.innerHTML=h;
    document.getElementById('sub').textContent='更新于 '+fmtUpd(d.updatedAt)+' · 数据来自电脑上的「迟到消消乐」';
  }
  function fail(){
    document.getElementById('app').innerHTML='<div class="card"><div class="empty">还没拿到数据</div>'
      +'<div class="empty" style="padding-top:0">打开电脑上的「迟到消消乐」→ 设置 → 📱 手机同步 → 点「立即同步」，再回这里下拉刷新即可。</div></div>';
    document.getElementById('sub').textContent='未连接';
  }
  if(window.__SAMPLE__){ render(window.__SAMPLE__); return; }
  fetch('data.json?_='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render).catch(fail);
})();
</script>
</body>
</html>
